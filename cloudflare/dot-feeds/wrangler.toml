# StormPath DOT/WZDx road-event feed — deploy: npm run deploy (from this folder)
# Serves normalized work-zone/closure events for the app's Plus road-notices pipeline.
# Snapshot is built by the dot-feeds-snapshot GitHub Action (free-plan CPU is
# 10 ms — too small to parse feeds inline) and pushed to /ingest -> KV.
# /events?bbox= filters server-side so the app only pulls events near the
# route corridor.

name = "stormpath-dot-feeds"
main = "src/index.ts"
compatibility_date = "2024-06-01"

[observability]
enabled = true


[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "bde839cd624d42f39dd8fab96dd05d3e"
