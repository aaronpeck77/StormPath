<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- StormPath Plus (yearly) App Store IAP promotional image.
       Distinct from the monthly promo and from the app icon. Keep lower-left quiet. -->
  <defs>
    <linearGradient id="skyY" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1B12"/>
      <stop offset="40%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0B0908"/>
    </linearGradient>
    <radialGradient id="radarY" cx="300" cy="240" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowY" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#skyY)"/>

  <g stroke="#3D2A1E" stroke-width="6" opacity="0.6">
    <path d="M 0 180 L 1024 260"/>
    <path d="M 0 380 L 1024 420"/>
    <path d="M 0 580 L 1024 540"/>
    <path d="M 0 780 L 1024 820"/>
    <path d="M 140 0 L 200 1024"/>
    <path d="M 360 0 L 420 1024"/>
    <path d="M 580 0 L 540 1024"/>
    <path d="M 800 0 L 860 1024"/>
  </g>

  <circle cx="300" cy="240" r="230" fill="url(#radarY)"/>
  <circle cx="300" cy="240" r="86" fill="none" stroke="#FDE68A" stroke-width="5" opacity="0.4"/>
  <circle cx="300" cy="240" r="140" fill="none" stroke="#FBBF24" stroke-width="4" opacity="0.25"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowY)">
    <path d="M 300 940 C 400 760, 520 620, 640 480 C 740 360, 820 240, 900 140"
          stroke="#FBBF24" stroke-width="28"/>
    <path d="M 300 940 C 360 820, 420 700, 520 600 C 640 480, 760 400, 920 300"
          stroke="#38BDF8" stroke-width="22"/>
    <path d="M 300 940 C 460 920, 580 820, 680 700 C 780 590, 860 560, 960 540"
          stroke="#FB7185" stroke-width="20"/>
  </g>

  <circle cx="900" cy="140" r="28" fill="#FFF7ED" stroke="#1C1410" stroke-width="8"/>
  <circle cx="900" cy="140" r="10" fill="#F59E0B"/>
</svg>
