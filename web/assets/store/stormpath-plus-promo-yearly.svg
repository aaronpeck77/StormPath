<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- StormPath Plus yearly IAP promo. Warm dusk map; different roads/colors from monthly.
       Not the storm-cloud app icon. Keep lower-left quiet. -->
  <defs>
    <linearGradient id="landY" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C1C12"/>
      <stop offset="50%" stop-color="#1A120C"/>
      <stop offset="100%" stop-color="#0C0908"/>
    </linearGradient>
    <linearGradient id="waterY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2818"/>
      <stop offset="100%" stop-color="#241810"/>
    </linearGradient>
    <radialGradient id="sunY" cx="280" cy="220" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowY" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinShadowY" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1C1008" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#landY)"/>

  <path
    d="M 0 280 C 140 220, 260 340, 380 300 C 500 260, 560 140, 720 120
       C 850 104, 940 160, 1024 140 L 1024 0 L 0 0 Z"
    fill="url(#waterY)"
    opacity="0.7"
  />
  <ellipse cx="180" cy="780" rx="210" ry="130" fill="url(#waterY)" opacity="0.45"/>

  <g fill="none" stroke="#6A4E38" stroke-linecap="round" opacity="0.95">
    <path d="M 10 360 C 200 330, 380 400, 560 360 C 740 322, 900 370, 1020 350" stroke-width="14"/>
    <path d="M 0 530 C 190 560, 370 500, 560 530 C 740 558, 880 500, 1024 540" stroke-width="13"/>
    <path d="M 30 700 C 210 670, 400 740, 600 710 C 780 684, 920 740, 1020 720" stroke-width="13"/>
    <path d="M 80 880 C 280 850, 460 920, 680 880 C 840 854, 940 900, 1010 890" stroke-width="12"/>
    <path d="M 180 20 C 150 240, 220 440, 180 640 C 150 800, 210 940, 190 1024" stroke-width="13"/>
    <path d="M 370 0 C 410 220, 340 430, 380 640 C 410 810, 340 950, 370 1024" stroke-width="12"/>
    <path d="M 580 10 C 540 210, 620 420, 580 640 C 548 810, 620 940, 590 1024" stroke-width="12"/>
    <path d="M 800 20 C 840 230, 760 430, 810 640 C 846 810, 770 950, 800 1020" stroke-width="12"/>
  </g>

  <g fill="none" stroke="#A07A58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 480 990 C 500 820, 560 660, 640 520 C 720 380, 800 260, 910 150" stroke-width="42"/>
    <path d="M 480 990 C 420 860, 300 760, 280 600 C 260 430, 420 340, 620 240" stroke-width="30"/>
    <path d="M 480 990 C 600 920, 720 860, 800 740 C 870 630, 900 560, 980 520" stroke-width="28"/>
  </g>
  <g fill="none" stroke="#1C1410" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 480 990 C 500 820, 560 660, 640 520 C 720 380, 800 260, 910 150" stroke-width="22"/>
    <path d="M 480 990 C 420 860, 300 760, 280 600 C 260 430, 420 340, 620 240" stroke-width="14"/>
    <path d="M 480 990 C 600 920, 720 860, 800 740 C 870 630, 900 560, 980 520" stroke-width="13"/>
  </g>

  <circle cx="280" cy="220" r="250" fill="url(#sunY)"/>
  <circle cx="280" cy="220" r="84" fill="none" stroke="#FDE68A" stroke-width="5" opacity="0.38"/>
  <circle cx="280" cy="220" r="140" fill="none" stroke="#FBBF24" stroke-width="4" opacity="0.2"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowY)">
    <path d="M 480 990 C 500 820, 560 660, 640 520 C 720 380, 800 260, 910 150"
          stroke="#FBBF24" stroke-width="20"/>
    <path d="M 480 990 C 420 860, 300 760, 280 600 C 260 430, 420 340, 620 240"
          stroke="#38BDF8" stroke-width="14"/>
    <path d="M 480 990 C 600 920, 720 860, 800 740 C 870 630, 900 560, 980 520"
          stroke="#FB7185" stroke-width="13"/>
  </g>

  <circle cx="480" cy="990" r="22" fill="#FFF7ED" stroke="#1C1410" stroke-width="7"/>
  <circle cx="480" cy="990" r="8" fill="#F59E0B"/>

  <g filter="url(#pinShadowY)" transform="translate(910 150)">
    <path d="M 0 -78 C 28 -78 50 -54 50 -28 C 50 8 0 62 0 62 C 0 62 -50 8 -50 -28 C -50 -54 -28 -78 0 -78 Z" fill="#FFF7ED"/>
    <path d="M 0 -78 C 28 -78 50 -54 50 -28 C 50 8 0 62 0 62 C 0 62 -50 8 -50 -28 C -50 -54 -28 -78 0 -78 Z" fill="none" stroke="#1C1410" stroke-width="8"/>
    <circle cx="0" cy="-32" r="16" fill="#F59E0B"/>
  </g>
</svg>
