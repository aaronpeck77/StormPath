      <path d="M 0 -20 C 13 -16 20 -3 11 13 C 5 7 2 18 0 26 C -2 18 -5 7 -11 13 C -20 -3 -13 -16 0 -20 Z" fill="#E11D48"/>
    </g>
    <g transform="translate(300 700) rotate(16)">
      <path d="M 0 -18 C 12 -14 18 -3 10 12 C 5 6 2 16 0 22 C -2 16 -5 6 -10 12 C -18 -3 -12 -14 0 -18 Z" fill="#F97316"/>
    </g>
    <g transform="translate(470 690) rotate(-20)">
      <path d="M 0 -20 C 13 -16 20 -3 11 13 C 5 7 2 18 0 26 C -2 18 -5 7 -11 13 C -20 -3 -13 -16 0 -20 Z" fill="#D97706"/>
