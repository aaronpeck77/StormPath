<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- StormPath Plus monthly IAP promo. Night driving map: roads, 3 routes, dest pin, radar.
       Not the storm-cloud app icon. Keep lower-left quiet (Apple overlays the app icon). -->
  <defs>
    <linearGradient id="landM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A40"/>
      <stop offset="55%" stop-color="#121C2C"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="waterM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3A4A"/>
      <stop offset="100%" stop-color="#082830"/>
    </linearGradient>
    <radialGradient id="radarM" cx="700" cy="250" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinShadowM" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#landM)"/>

  <!-- Lake / river so it reads as a map, not a grid -->
  <path
    d="M 0 70 C 180 40, 280 160, 360 210 C 460 270, 520 200, 640 160
       C 760 118, 880 90, 1024 130 L 1024 0 L 0 0 Z"
    fill="url(#waterM)"
    opacity="1"
  />
  <path
    d="M 820 620 C 900 580, 980 640, 1024 720 L 1024 1024 L 760 1024
       C 780 900, 740 760, 820 620 Z"
    fill="url(#waterM)"
    opacity="0.55"
  />

  <!-- Local streets -->
  <g fill="none" stroke="#4A6584" stroke-linecap="round" opacity="0.95">
    <path d="M 40 300 C 200 280, 360 320, 520 300 C 700 276, 860 310, 1000 290" stroke-width="14"/>
    <path d="M 20 470 C 180 500, 340 450, 520 470 C 700 492, 840 450, 1010 480" stroke-width="13"/>
    <path d="M 60 640 C 220 620, 400 670, 580 650 C 740 632, 900 680, 1020 660" stroke-width="13"/>
    <path d="M 80 800 C 260 780, 420 840, 620 810 C 780 788, 900 830, 1000 820" stroke-width="12"/>
    <path d="M 210 40 C 190 240, 250 430, 220 620 C 196 780, 250 920, 240 1020" stroke-width="13"/>
    <path d="M 400 20 C 430 220, 380 420, 410 620 C 436 790, 380 930, 400 1020" stroke-width="12"/>
    <path d="M 590 10 C 560 200, 620 400, 590 600 C 564 780, 620 920, 600 1024" stroke-width="12"/>
    <path d="M 790 30 C 820 220, 760 420, 800 620 C 828 790, 770 930, 790 1020" stroke-width="12"/>
  </g>

  <!-- Highway casings (grey pavement under the colored routes) -->
  <g fill="none" stroke="#7A8FA8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 430 980 C 450 820, 480 680, 530 560 C 590 420, 700 300, 860 170" stroke-width="42"/>
    <path d="M 430 980 C 380 860, 340 740, 360 620 C 390 470, 560 400, 760 300" stroke-width="30"/>
    <path d="M 430 980 C 540 900, 640 820, 700 700 C 760 580, 820 520, 940 470" stroke-width="28"/>
  </g>
  <g fill="none" stroke="#1A2433" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 430 980 C 450 820, 480 680, 530 560 C 590 420, 700 300, 860 170" stroke-width="22"/>
    <path d="M 430 980 C 380 860, 340 740, 360 620 C 390 470, 560 400, 760 300" stroke-width="14"/>
    <path d="M 430 980 C 540 900, 640 820, 700 700 C 760 580, 820 520, 940 470" stroke-width="13"/>
  </g>

  <circle cx="700" cy="250" r="260" fill="url(#radarM)"/>
  <circle cx="700" cy="250" r="88" fill="none" stroke="#67E8F9" stroke-width="5" opacity="0.4"/>
  <circle cx="700" cy="250" r="148" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.22"/>

  <!-- Three Plus routes on the pavement -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowM)">
    <path d="M 430 980 C 450 820, 480 680, 530 560 C 590 420, 700 300, 860 170"
          stroke="#38BDF8" stroke-width="20"/>
    <path d="M 430 980 C 380 860, 340 740, 360 620 C 390 470, 560 400, 760 300"
          stroke="#FB923C" stroke-width="14"/>
    <path d="M 430 980 C 540 900, 640 820, 700 700 C 760 580, 820 520, 940 470"
          stroke="#4ADE80" stroke-width="13"/>
  </g>

  <!-- Driver puck (bottom-center, not lower-left) -->
  <circle cx="430" cy="980" r="22" fill="#E2E8F0" stroke="#0F172A" stroke-width="7"/>
  <circle cx="430" cy="980" r="8" fill="#38BDF8"/>

  <!-- Destination pin — classic map drop, not the app icon -->
  <g filter="url(#pinShadowM)" transform="translate(860 170)">
    <path d="M 0 -78 C 28 -78 50 -54 50 -28 C 50 8 0 62 0 62 C 0 62 -50 8 -50 -28 C -50 -54 -28 -78 0 -78 Z" fill="#F8FAFC"/>
    <path d="M 0 -78 C 28 -78 50 -54 50 -28 C 50 8 0 62 0 62 C 0 62 -50 8 -50 -28 C -50 -54 -28 -78 0 -78 Z" fill="none" stroke="#0F172A" stroke-width="8"/>
    <circle cx="0" cy="-32" r="16" fill="#38BDF8"/>
  </g>
</svg>
