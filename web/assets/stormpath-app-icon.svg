<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloud-main" x1="512" y1="220" x2="512" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#646C90"/>
      <stop offset="35%" stop-color="#434A6C"/>
      <stop offset="72%" stop-color="#2B3048"/>
      <stop offset="100%" stop-color="#181C30"/>
    </linearGradient>
    <radialGradient id="cloud-highlight" cx="460" cy="280" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7E86AA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#434A6C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="540" y1="210" x2="470" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#CFFAFE"/>
      <stop offset="40%" stop-color="#67E8F9"/>
      <stop offset="62%" stop-color="#FEF08A"/>
      <stop offset="82%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="bolt-glow" x1="540" y1="210" x2="470" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8D0DC"/>
    </linearGradient>
    <filter id="cloud-shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1220" flood-opacity="0.26"/>
    </filter>
    <filter id="bolt-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#5EB8E8"/>

  <!-- Unified storm cloud � single mass, inspired by original icon art -->
  <g filter="url(#cloud-shadow)">
    <path
      d="M 160 400
         C 150 318 228 248 330 236
         C 378 196 468 184 544 208
         C 612 182 712 188 776 232
         C 852 220 910 278 904 342
         C 948 368 940 418 888 442
         C 906 472 872 502 812 512
         H 212
         C 152 502 126 468 148 432
         C 118 408 128 418 160 400 Z"
      fill="url(#cloud-main)"
    />
    <path
      d="M 160 400
         C 150 318 228 248 330 236
         C 378 196 468 184 544 208
         C 612 182 712 188 776 232
         C 852 220 910 278 904 342
         C 948 368 940 418 888 442
         C 906 472 872 502 812 512
         H 212
         C 152 502 126 468 148 432
         C 118 408 128 418 160 400 Z"
      fill="url(#cloud-highlight)"
    />
    <path
      d="M 204 468 Q 512 492 820 468 L 820 498 Q 512 522 204 498 Z"
      fill="#12162A"
      opacity="0.55"
    />
  </g>

  <!-- White / silver rain -->
  <g stroke-linecap="round" transform="translate(512 530) rotate(16) translate(-512 -530)">
    <line x1="262" y1="458" x2="214" y2="562" stroke="url(#rain)" stroke-width="24" opacity="0.93"/>
    <line x1="332" y1="468" x2="284" y2="582" stroke="#FFFFFF" stroke-width="22" opacity="0.96"/>
    <line x1="402" y1="462" x2="354" y2="576" stroke="url(#rain)" stroke-width="21" opacity="0.92"/>
    <line x1="472" y1="472" x2="424" y2="586" stroke="#F8FAFC" stroke-width="20" opacity="0.94"/>
    <line x1="592" y1="466" x2="544" y2="580" stroke="url(#rain)" stroke-width="22" opacity="0.93"/>
    <line x1="662" y1="474" x2="614" y2="588" stroke="#FFFFFF" stroke-width="21" opacity="0.95"/>
    <line x1="732" y1="460" x2="684" y2="574" stroke="url(#rain)" stroke-width="20" opacity="0.91"/>
    <line x1="802" y1="468" x2="754" y2="582" stroke="#EEF2F7" stroke-width="19" opacity="0.9"/>
    <line x1="362" y1="512" x2="314" y2="626" stroke="#FFFFFF" stroke-width="17" opacity="0.88"/>
    <line x1="532" y1="516" x2="484" y2="630" stroke="url(#rain)" stroke-width="17" opacity="0.87"/>
    <line x1="702" y1="508" x2="654" y2="622" stroke="#FFFFFF" stroke-width="16" opacity="0.86"/>
  </g>

  <!-- Lightning � angular S-zigzag, cyan-to-gold like original icon -->
  <g filter="url(#bolt-glow-filter)">
    <path
      d="M 578 218 L 520 318 L 562 318 L 492 438 L 536 438 L 466 578 L 516 478 L 476 478 L 546 358 L 506 358 L 556 258 Z"
      fill="url(#bolt-glow)"
      opacity="0.5"
    />
    <path
      d="M 578 218 L 520 318 L 562 318 L 492 438 L 536 438 L 466 578 L 516 478 L 476 478 L 546 358 L 506 358 L 556 258 Z"
      fill="url(#bolt)"
      stroke="#171B28"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <path
      d="M 578 218 L 520 318 L 562 318 L 492 438"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.62"
    />
  </g>
</svg>
