# Git-connected Netlify deploy (stormpath2). Drag-and-drop dist uploads do NOT deploy functions.
# Connect this repo in Netlify → Site configuration → Build: base `web`, command below.
#
# ignore: exit 0 = skip deploy (saves build minutes). See web/scripts/netlify-ignore.sh.
# Skips branch/PR previews and any push that only touched app/UI/nav (TestFlight uses GH Actions).
# Builds when: netlify/functions, public/ (legal pages), netlify.toml, or related package/config.

[build]
  base = "web"
  command = "npm run build:netlify"
  publish = "dist"
  ignore = "bash ./scripts/netlify-ignore.sh"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Extra belt: never spend minutes on branch / PR deploy contexts.
[context.branch-deploy]
  ignore = "exit 0"

[context.deploy-preview]
  ignore = "exit 0"
