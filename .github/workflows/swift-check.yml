name: Swift plugin check

# Fast compile check for the Capacitor Swift plugins. Catches API drift in
# ~3 min instead of discovering it at the end of the 17-min TestFlight
# archive. Runs when plugin iOS code changes on PRs, and on demand.

on:
  pull_request:
    paths:
      - "web/plugins/**/ios/**"
      - "web/plugins/**/Package.swift"
  push:
    branches: [master]
    paths:
      - "web/plugins/**/ios/**"
      - "web/plugins/**/Package.swift"
  workflow_dispatch:

jobs:
  swift-check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile stormpath-mapbox-navigation
        working-directory: web/plugins/stormpath-mapbox-navigation
        run: |
          # SPM lists dependency schemes too — pick ours by name, not schemes[0].
          xcodebuild -list -json 2>/dev/null > /tmp/schemes.json || true
          SCHEME=$(python3 -c "import json; s=json.load(open('/tmp/schemes.json'))['workspace']['schemes']; m=[x for x in s if 'stormpath' in x.lower()]; print(m[0] if m else '')")
          echo "Available: $(python3 -c "import json; print(json.load(open('/tmp/schemes.json'))['workspace']['schemes'])")"
          if [ -z "$SCHEME" ]; then echo "::error::No Stormpath scheme found"; exit 1; fi
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
