# Fast feedback on every push — separate from the 60-minute iOS build.
name: Web tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Assert production bundle is App Store flavor (not forced Plus)
        run: node scripts/assert-ios-build-flavor.mjs appstore

      - name: Unit tests
        run: npm test
