# ─────────────────────────────────────────────────────────────────────────────
# StormPath — iOS Build & TestFlight Upload
#
# Triggers:
#   • Every push to the "main" branch
#   • Manually from Actions tab (workflow_dispatch)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE            Base64-encoded .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD   Password set when exporting the .p12
#   APPLE_PROVISIONING_PROFILE   Base64-encoded .mobileprovision file
#   APPLE_TEAM_ID                10-character Team ID from developer.apple.com
#   APP_STORE_CONNECT_API_KEY_ID        Key ID from App Store Connect → Keys
#   APP_STORE_CONNECT_ISSUER_ID         Issuer ID from the same page
#   APP_STORE_CONNECT_API_KEY_CONTENT   The .p8 file: paste full PEM *or* base64 of the file
#   VITE_MAPBOX_TOKEN                   Mapbox public token (map + search + directions)
#   MAPBOX_DOWNLOADS_TOKEN              Mapbox *secret* token with Downloads:Read (SPM pulls Navigation SDK)
#   VITE_TOMORROW_IO_API_KEY            Tomorrow.io (legacy — omit when WeatherKit enabled)
#   VITE_TOMORROW_IO_TILE_PROXY_URL     Cloudflare tile worker base (see docs/CLOUDFLARE_TILES.md)
#   CLOUDFLARE_API_TOKEN                Workers deploy (workflow: Deploy Cloudflare tiles)
#   CLOUDFLARE_ACCOUNT_ID               Same workflow
#   VITE_OPENWEATHER_API_KEY            OpenWeather (legacy — omit when WeatherKit enabled)
#   VITE_WEATHERKIT_ENABLED             Set to `true` after Netlify token function is live (see docs/WEATHERKIT_SETUP.md)
#   VITE_SENTRY_DSN                     Sentry DSN for crash reports (optional; see docs/SENTRY_SETUP.md)
#   VITE_REVENUECAT_API_KEY_IOS         RevenueCat public SDK key — required for App Store track builds
#   VITE_OPS_USAGE_INGEST_TOKEN         Control Room usage/Jeff reporting (optional; must match Netlify's
#                                       OPS_USAGE_INGEST_TOKEN). Without it, TestFlight/App Store builds
#                                       never report Mapbox usage or Jeff fixes — Control Room stays empty.
# TestFlight track: committed web/.env.testflight (Plus for testers).
# App Store track: committed web/.env.production (Basic default) + RevenueCat secret above.
# ─────────────────────────────────────────────────────────────────────────────

name: iOS Build & TestFlight

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_track:
        description: "Web bundle flavor baked into the IPA"
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - appstore

# Only one iOS build runs at a time per branch.
# A newer push cancels any in-progress build so macOS runner minutes aren't wasted.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.build_track || 'testflight' }}
      # Quieter Action-step deprecation warnings until third-party actions ship Node 24 runtimes.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash

    steps:
      # ── 1. Source code ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      # ── 2. Node + npm cache ──────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # ── 3. Install JS deps ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        working-directory: web

      # ── 4. Build the web app ─────────────────────────────────────────────────
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: web
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_TOMORROW_IO_API_KEY: ${{ secrets.VITE_TOMORROW_IO_API_KEY }}
          VITE_TOMORROW_IO_TILE_PROXY_URL: ${{ secrets.VITE_TOMORROW_IO_TILE_PROXY_URL }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_WEATHERKIT_ENABLED: ${{ secrets.VITE_WEATHERKIT_ENABLED }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # Vitest seatbelt — runs in parallel with the build setup if the runner had cores
      # to spare; in practice it adds <5s to the job. Failing tests block the IPA build.
      - name: Run unit tests
        run: npm test
        working-directory: web

      - name: Sync iOS marketing version + build number
        run: npm run sync:ios-version
        working-directory: web
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          # Also writes MBXAccessToken into Info.plist for Navigation SDK.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      # Mapbox Navigation Core is fetched via SPM from api.mapbox.com — needs a secret
      # token with Downloads:Read on the CI Mac (same as a local ~/.netrc). You do NOT
      # need a Mac at your desk; this runner is the Mac.
      - name: Configure Mapbox downloads (.netrc)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]; then
            echo "::error::GitHub secret MAPBOX_DOWNLOADS_TOKEN is missing."
            echo "Create a Mapbox secret token with Downloads:Read, then add it as a repo Action secret."
            echo "See web/plugins/stormpath-mapbox-navigation/README.md"
            exit 1
          fi
          cat > "$HOME/.netrc" <<EOF
          machine api.mapbox.com
          login mapbox
          password ${MAPBOX_DOWNLOADS_TOKEN}
          EOF
          chmod 600 "$HOME/.netrc"

      - name: Build web app (TestFlight mode — Plus, support URLs, NWS UA from .env.testflight)
        if: env.BUILD_TRACK == 'testflight'
        run: npm run build:testflight
        working-directory: web
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_TOMORROW_IO_API_KEY: ${{ secrets.VITE_TOMORROW_IO_API_KEY }}
          VITE_TOMORROW_IO_TILE_PROXY_URL: ${{ secrets.VITE_TOMORROW_IO_TILE_PROXY_URL }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_WEATHERKIT_ENABLED: ${{ secrets.VITE_WEATHERKIT_ENABLED }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_OPS_USAGE_INGEST_TOKEN: ${{ secrets.VITE_OPS_USAGE_INGEST_TOKEN }}
          VITE_IOS_BUILD_NUMBER: ${{ github.run_number }}

      - name: Require RevenueCat key (App Store track)
        if: env.BUILD_TRACK == 'appstore'
        env:
          VITE_REVENUECAT_API_KEY_IOS: ${{ secrets.VITE_REVENUECAT_API_KEY_IOS }}
        run: |
          if [ -z "${VITE_REVENUECAT_API_KEY_IOS}" ]; then
            echo "::error::GitHub secret VITE_REVENUECAT_API_KEY_IOS is missing or empty."
            echo "RevenueCat → Apps → StormPath → API keys → copy the iOS public key (appl_…)."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Without it, About → Subscription shows Upgrade link not set instead of Subscribe."
            exit 1
          fi

      - name: Require live privacy policy (App Store track)
        if: env.BUILD_TRACK == 'appstore'
        run: |
          set -euo pipefail
          URL="https://stormpath2.netlify.app/privacy.html"
          echo "App Store Connect uses this URL. It must match the ATT/AdMob/RevenueCat copy."
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            html="$(curl -fsSL "$URL" || true)"
            if printf '%s' "$html" | grep -q "App Tracking Transparency" \
              && printf '%s' "$html" | grep -q "RevenueCat" \
              && printf '%s' "$html" | grep -q "Sentry"; then
              echo "Live privacy policy OK: $URL"
              ok=1
              break
            fi
            echo "Attempt $i: $URL is missing ATT/RevenueCat/Sentry copy. Waiting for Netlify…"
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::$URL is stale. Push to master without [skip netlify] so Netlify deploys web/public/privacy.html, then re-run the appstore track."
            exit 1
          fi

      - name: Build web app (App Store mode — Basic default, IAP via RevenueCat)
        if: env.BUILD_TRACK == 'appstore'
        run: npm run build:appstore
        working-directory: web
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_TOMORROW_IO_API_KEY: ${{ secrets.VITE_TOMORROW_IO_API_KEY }}
          VITE_TOMORROW_IO_TILE_PROXY_URL: ${{ secrets.VITE_TOMORROW_IO_TILE_PROXY_URL }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_WEATHERKIT_ENABLED: ${{ secrets.VITE_WEATHERKIT_ENABLED }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_REVENUECAT_API_KEY_IOS: ${{ secrets.VITE_REVENUECAT_API_KEY_IOS }}
          VITE_OPS_USAGE_INGEST_TOKEN: ${{ secrets.VITE_OPS_USAGE_INGEST_TOKEN }}
          VITE_IOS_BUILD_NUMBER: ${{ github.run_number }}

      # ── 5. Sync web assets into the Xcode project ────────────────────────────
      - name: Capacitor sync
        run: npx cap sync ios
        working-directory: web

      - name: Validate iOS app icon (must be 1024×1024)
        run: npm run validate:app-icon
        working-directory: web

      # ── 5b. Xcode / iOS SDK (App Store minimum) ─────────────────────────────
      # Default selected Xcode on the runner is 16.x (iOS 18 SDK). Apple rejects uploads built with
      # that SDK when they require iOS 26+ / Xcode 26+. Runner images ship Xcode 26.x side-by-side:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          set -euo pipefail
          DEV=""
          for APP in \
            "/Applications/Xcode_26.3.app" \
            "/Applications/Xcode_26.2.app" \
            "/Applications/Xcode_26.1.1.app" \
            "/Applications/Xcode_26.0.1.app"
          do
            if [[ -d "$APP" ]]; then
              DEV="$APP/Contents/Developer"
              break
            fi
          done
          if [[ -z "$DEV" ]]; then
            echo "No Xcode 26.x app found under /Applications. Paths may differ — see runner-images macOS README."
            ls -la /Applications/ | grep -i xcode || true
            exit 1
          fi
          sudo xcode-select -s "$DEV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── 6. Apple code-signing certificate ───────────────────────────────────
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # ── 7. Provisioning profile ───────────────────────────────────────────────
      - name: Install provisioning profile
        id: profile
        run: |
          PP_PATH="$RUNNER_TEMP/StormPath.mobileprovision"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > "$PP_PATH"
          # Extract UUID so xcodebuild can find the profile by name
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      # ── 7b. Inject the provisioning profile UUID into the App target only ────
      # The committed project.pbxproj has CODE_SIGN_STYLE=Manual + a placeholder
      # PROVISIONING_PROFILE_SPECIFIER so the manual signing settings are scoped
      # to the App target's Release config. We must NOT pass these on the xcodebuild
      # CLI, because that applies them globally to every transitive target — including
      # SPM resource bundles like RevenueCat_RevenueCat, which Xcode 26 rejects with
      # "<bundle> does not support provisioning profiles".
      - name: Inject provisioning profile UUID into Xcode project
        run: |
          set -euo pipefail
          PROJ="web/ios/App/App.xcodeproj/project.pbxproj"
          UUID="${{ steps.profile.outputs.uuid }}"
          # Sanity-check the placeholder is present so a future regeneration doesn't silently break us.
          if ! grep -q "STORMPATH_PROVISIONING_PROFILE_UUID" "$PROJ"; then
            echo "Placeholder STORMPATH_PROVISIONING_PROFILE_UUID is missing from $PROJ."
            echo "Re-add PROVISIONING_PROFILE_SPECIFIER = STORMPATH_PROVISIONING_PROFILE_UUID; to the App target's Release config."
            exit 1
          fi
          /usr/bin/sed -i '' "s/STORMPATH_PROVISIONING_PROFILE_UUID/$UUID/g" "$PROJ"
          # Verify the substitution actually happened.
          if grep -q "STORMPATH_PROVISIONING_PROFILE_UUID" "$PROJ"; then
            echo "sed substitution failed."
            exit 1
          fi

      # ── 8. Build number already set via sync:ios-version (IOS_BUILD_NUMBER) ───

      # ── 8b. Pre-resolve Swift Package Manager dependencies ───────────────────
      # `Package.resolved` is committed for reproducible local dev, but `npx cap sync ios`
      # (and the developer's Windows workstation) doesn't update it when plugins are added —
      # only macOS Xcode does. To keep CI from failing the strict Package.resolved consistency
      # check that Xcode 16+ enforces during `archive`, refresh it explicitly first.
      # `-onlyUsePackageVersionsFromResolvedFile=NO` lets SPM re-resolve when Package.swift
      # has new packages that aren't in the lockfile.
      - name: Resolve Swift Package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project web/ios/App/App.xcodeproj \
            -scheme App \
            -onlyUsePackageVersionsFromResolvedFile=NO \
            2>&1 | tee /tmp/spm-resolve.log

      # ── 9. Build the Xcode archive ───────────────────────────────────────────
      # Code signing settings (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
      # PROVISIONING_PROFILE_SPECIFIER, DEVELOPMENT_TEAM) live in the App target's
      # Release config in project.pbxproj. We deliberately do NOT pass them on the
      # CLI here — passing them globally applies them to every transitive target,
      # including SPM resource bundles (e.g. RevenueCat_RevenueCat) which Xcode 26
      # rejects as "does not support provisioning profiles".
      - name: Build archive
        run: |
          set -o pipefail
          # Last command must be this pipeline — its exit status becomes the step status (do not add a
          # separate `exit ${PIPESTATUS[0]}` line; `bash -e` / shell quirks can interfere).
          xcodebuild archive \
            -project web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/StormPath.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=YES \
            2>&1 | tee /tmp/xcodebuild.log

      # ── 10. Export the IPA ────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          PROFILE_UUID="${{ steps.profile.outputs.uuid }}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.aaronpeck.stormpath</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StormPath.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee /tmp/export.log

      # ── 11. Upload to TestFlight ──────────────────────────────────────────────
      # Xcode 26 xcrun altool is unreliable (false success or hard failure). Use the
      # App Store Connect API backend instead of altool/iTMSTransporter.
      # Normalize the .p8 secret first — GitHub often stores base64/DER; Node crypto needs PEM.
      - name: Prepare App Store Connect API key
        id: asc_key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          python3 .github/scripts/write-appstore-connect-key.py
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          {
            echo 'pem<<EOF'
            cat "$KEY_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log IPA build metadata
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/export/App.ipa"
          PLIST=$(unzip -p "$IPA" 'Payload/*.app/Info.plist')
          echo "Expected TestFlight build number: ${{ github.run_number }}"
          echo "Build track: ${{ env.BUILD_TRACK }}"
          echo "IPA CFBundleVersion: $(echo "$PLIST" | plutil -extract CFBundleVersion raw -)"
          echo "IPA CFBundleShortVersionString: $(echo "$PLIST" | plutil -extract CFBundleShortVersionString raw -)"
          echo "IPA CFBundleIdentifier: $(echo "$PLIST" | plutil -extract CFBundleIdentifier raw -)"

      - name: Verify App Store Connect API access
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 .github/scripts/verify-appstore-connect-api.py

      # Primary: App Store Connect API. Fallback: Transporter (skips app lookup — helps when API returns 403).
      - name: Upload to TestFlight (App Store Connect API)
        id: asc_upload
        continue-on-error: true
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ steps.asc_key.outputs.pem }}
          backend: appstore-api
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"

      - name: Upload to TestFlight (Transporter fallback)
        if: steps.asc_upload.outcome == 'failure'
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ steps.asc_key.outputs.pem }}
          backend: transporter
          uses-non-exempt-encryption: "false"
          wait-for-processing: "false"

      # ── 12. Save IPA as a build artifact (optional — handy for debugging) ────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: StormPath-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/export/App.ipa
          retention-days: 14
          # If archive/export failed, there is no IPA — do not fail the job on this optional step.
          if-no-files-found: ignore
